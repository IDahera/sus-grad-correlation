[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "susgrad"
version = "0.1.0"
description = "Suspiciousness / gradient correlation experiments for neural networks"
readme = "README.md"
# Developed on 3.14; the code itself uses nothing newer than 3.11, and the
# published artefact has to install on whatever a reviewer already has (the
# Docker images and CI default to 3.12, which every torch wheel supports).
requires-python = ">=3.11"
authors = [{ name = "Daniel Rashedi" }]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "click>=8.1",
    "tqdm>=4.65",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Descriptive console entry points -- an alternative to numeric file prefixes.
# After `pip install -e .` these become runnable commands.
[project.scripts]
# Experiment 1 -- suspiciousness vs. gradient ACROSS random initialisations.
train-ensemble = "scripts.train_ensemble:main"
correlate-ensemble = "scripts.correlate_ensemble:main"
evaluate-ensemble = "scripts.evaluate_ensemble:main"
figures-ensemble = "scripts.figures_ensemble:main"
overview-ensemble = "scripts.overview_ensemble:main"
# Experiment 2 -- how one model's values evolve ACROSS epochs.
train-trajectory = "scripts.train_trajectory:main"
plot-trajectory = "scripts.plot_trajectory:main"
# Secondary pipeline.
train-models = "scripts.train_models:main"
capture-gradients = "scripts.capture_gradients:main"
capture-suspiciousness = "scripts.capture_suspiciousness:main"
correlate = "scripts.correlate:main"
evaluate = "scripts.evaluate:main"
overview = "scripts.overview:main"

[tool.setuptools]
packages = [
    "susgrad",
    "susgrad.models",
    "susgrad.sbfl",
    "susgrad.grads",
    "susgrad.correlation",
    "susgrad.persistence",
    "susgrad.training",
    "susgrad.viz",
    "susgrad.utils",
    "scripts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
